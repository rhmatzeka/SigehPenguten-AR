<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tari Sigeh Penguten AR</title>
  <style>
    :root { --bg: #f8d7b0; --card: #fdf6dc; --ink: #2b1a0a; --accent: #b8862f; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--ink);
      font-family: Georgia, "Times New Roman", serif; padding: 16px;
    }
    main {
      background: var(--card); border-radius: 24px; padding: 32px 24px;
      max-width: 420px; width: 100%; text-align: center;
      box-shadow: 0 8px 24px rgba(43, 26, 10, .12);
    }
    h1 { margin: 0 0 4px; font-size: 2rem; }
    .sub { margin: 0 0 24px; font-family: system-ui, sans-serif; font-weight: 600; font-size: .95rem; }
    .badge {
      display: inline-block; background: var(--bg); border-radius: 999px;
      padding: 10px 20px; font-size: 1rem;
    }
    .hint { margin-top: 20px; font-family: system-ui, sans-serif; font-size: .85rem; color: #6b5233; }
  </style>
</head>
<body>
  <main>
    <h1>Tari Sigeh Penguten</h1>
    <p class="sub">Tarian Tradisional Provinsi Lampung</p>
    <span class="badge">Penari AR sedang disiapkan</span>
    <p class="hint">Halaman ini akan menampilkan penari 3D di atas poster. Silakan coba lagi nanti.</p>
  </main>
</body>
</html>
